{{- $vaultRaw := .Values.vault | default dict -}}
{{- if and (kindIs "map" $vaultRaw) (or (not (hasKey $vaultRaw "enabled")) $vaultRaw.enabled) }}
{{- $vault := omit $vaultRaw "enabled" }}
{{- range $name, $secret := $vault }}
{{- if eq (include "secret.isEnabled" $secret) "true" }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "secret.fullname" (dict "name" (default $name $secret.name) "Release" $.Release) }}
  labels:
    {{- include "secret.labels" $ | nindent 4 }}
spec:
  refreshInterval: {{ $secret.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ $secret.secretStore | default "vault" }}
    kind: {{ $secret.secretStoreKind | default "ClusterSecretStore" }}
  target:
    name: {{ include "secret.fullname" (dict "name" (default $name $secret.name) "Release" $.Release) }}
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ tpl ($secret.path | default $name) $ }}
{{- end }}
{{- end }}
{{- end }}
