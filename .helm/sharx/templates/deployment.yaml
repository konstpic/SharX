apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sharx.fullname" . }}
  labels:
    {{- include "sharx.labels" . | nindent 4 }}
    app.kubernetes.io/component: panel
spec:
  replicas: {{ .Values.panel.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "sharx.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: panel
  template:
    metadata:
      labels:
        {{- include "sharx.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: panel
    spec:
      serviceAccountName: {{ include "sharx.serviceAccountName" . }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: sharx
          image: {{ include "sharx.panelImage" . }}
          imagePullPolicy: {{ .Values.panel.image.pullPolicy }}
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
          ports:
            - name: web
              containerPort: {{ .Values.panel.env.webPort | int }}
            - name: sub
              containerPort: {{ .Values.panel.env.subPort | int }}
          env:
            - name: XRAY_VMESS_AEAD_FORCED
              value: {{ .Values.panel.env.xrayVmessAeadForced | quote }}
            - name: XUI_ENABLE_FAIL2BAN
              value: {{ .Values.panel.env.enableFail2ban | quote }}
            - name: XUI_LOG_LEVEL
              value: {{ .Values.panel.env.logLevel | quote }}
            - name: XUI_WEB_PORT
              value: {{ .Values.panel.env.webPort | quote }}
            - name: XUI_WEB_LISTEN
              value: {{ .Values.panel.env.webListen | quote }}
            - name: XUI_WEB_DOMAIN
              value: {{ .Values.panel.env.webDomain | default .Values.ingress.panel.host | quote }}
            - name: XUI_WEB_BASE_PATH
              value: {{ .Values.panel.env.webBasePath | quote }}
            - name: XUI_SUB_PORT
              value: {{ .Values.panel.env.subPort | quote }}
            - name: XUI_SUB_PATH
              value: {{ .Values.panel.env.subPath | quote }}
            - name: XUI_SUB_DOMAIN
              value: {{ .Values.panel.env.subDomain | default .Values.ingress.sub.host | quote }}
            - name: XUI_DB_HOST
              value: {{ .Values.panel.env.dbHost | default (include "sharx.postgresFullname" .) | quote }}
            - name: XUI_DB_PORT
              value: {{ .Values.panel.env.dbPort | quote }}
            - name: XUI_DB_USER
              value: {{ .Values.panel.env.dbUser | quote }}
            - name: XUI_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret }}
                  key: XUI_DB_PASSWORD
            - name: XUI_DB_NAME
              value: {{ .Values.panel.env.dbName | quote }}
            - name: XUI_DB_SSLMODE
              value: {{ .Values.panel.env.dbSslMode | quote }}
          readinessProbe:
            tcpSocket:
              port: web
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: web
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            {{- toYaml .Values.panel.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: cert
              mountPath: /app/cert
            - name: dev-tun
              mountPath: /dev/net/tun
      volumes:
        - name: dev-tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
        - name: data
          {{- if .Values.panel.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "sharx.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: cert
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sharx.fullname" . }}
  labels:
    {{- include "sharx.labels" . | nindent 4 }}
    app.kubernetes.io/component: panel
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.panel.env.webPort | int }}
      targetPort: web
      name: web
    - port: {{ .Values.panel.env.subPort | int }}
      targetPort: sub
      name: sub
  selector:
    {{- include "sharx.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: panel
