global:
  env: sharxconnect
  instance: main
  imageRegistry: registry.konstpic.ru/sharx
  vault_base_path: sharxconnect

secret:
  vault:
    db:
      path: '{{ .Values.global.vault_base_path }}/sharx/db'

panel:
  nameOverride: panel
  replicaType: Deployment
  strategy: Recreate
  replicas: 1
  image: '{{ .Values.global.imageRegistry }}/sharx:{{ .Values.global.appVersion | default "latest" }}'
  imagePullPolicy: Always
  serviceAccount:
    create: true
    name: sharx
  containerSecurityContext:
    capabilities:
      add:
        - NET_ADMIN
  endpoints:
    ClusterIP:
      web:
        port: 2053
        containerPort: 2053
      sub:
        port: 2096
        containerPort: 2096
  envs:
    XRAY_VMESS_AEAD_FORCED: "false"
    XUI_ENABLE_FAIL2BAN: "true"
    XUI_LOG_LEVEL: info
    XUI_WEB_PORT: "2053"
    XUI_WEB_LISTEN: "0.0.0.0"
    XUI_WEB_DOMAIN: ""
    XUI_WEB_BASE_PATH: /
    XUI_SUB_PORT: "2096"
    XUI_SUB_PATH: /sub/
    XUI_SUB_DOMAIN: ""
    XUI_DB_HOST: '{{ printf "%s-postgres" .Release.Name }}'
    XUI_DB_PORT: "5432"
    XUI_DB_USER: xui_user
    XUI_DB_NAME: xui_db
    XUI_DB_SSLMODE: disable
  secrets:
    db:
      data:
        XUI_DB_PASSWORD:
          env: XUI_DB_PASSWORD
  persistence:
    createClaim: true
    size: 5Gi
    mountPath: /app/data
  volumes:
    - name: cert
      emptyDir: {}
    - name: dev-tun
      hostPath:
        path: /dev/net/tun
        type: CharDevice
  volumeMounts:
    - name: cert
      mountPath: /app/cert
    - name: dev-tun
      mountPath: /dev/net/tun
  readinessProbe:
    enabled: true
    type: tcp
    port: 2053
    initDelay: 15
    period: 10
  livenessProbe:
    enabled: true
    type: tcp
    port: 2053
    initDelay: 60
    period: 30
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
  ingresses:
    panel:
      enabled: true
      className: nginx
      host: panel.example.com
      path: /
      servicePort: 2053
      tls:
        enabled: true
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
    sub:
      enabled: true
      className: nginx
      host: sub.example.com
      path: /
      servicePort: 2096
      tls:
        enabled: true
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod

postgres:
  nameOverride: postgres
  replicaType: StatefulSet
  replicas: 1
  image: '{{ .Values.global.imageRegistry }}/postgres:16-alpine'
  imagePullPolicy: IfNotPresent
  envs:
    PGDATA: /var/lib/postgresql/data/pgdata
    POSTGRES_USER: xui_user
    POSTGRES_DB: xui_db
  secrets:
    db:
      data:
        POSTGRES_PASSWORD:
          env: POSTGRES_PASSWORD
  endpoints:
    ClusterIP:
      pg:
        port: 5432
        containerPort: 5432
  persistence:
    enabled: true
    createClaim: true
    size: 10Gi
    mountPath: /var/lib/postgresql/data
  readinessProbe:
    enabled: true
    type: exec
    command: ["/bin/sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
    initDelay: 10
    period: 10
  livenessProbe:
    enabled: true
    type: exec
    command: ["/bin/sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
    initDelay: 30
    period: 20
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
